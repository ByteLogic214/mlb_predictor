[project]
name = "mlb-predictor-phase-1"
version = "1.0.0"
requires-python = ">=3.11"

dependencies = [
    "httpx>=0.27,<1",
    "pandas>=2.2,<3",
    "pyarrow>=17,<19",
    "pydantic-settings>=2.4,<3",
    "pytest>=8.3,<9"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
